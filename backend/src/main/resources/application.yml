# ================= application.yml =================

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: tracker
        format_sql: ${JPA_FORMAT_SQL:false}

  sql:
    init:
      mode: never
      continue-on-error: false

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-with-at-least-32-characters}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail-from: ${APP_MAIL_FROM:noreply@supportflow.local}
  knowledge-base:
    storage-dir: ${KNOWLEDGE_BASE_STORAGE_DIR:uploads/knowledge-base}
    purge-cron: ${KNOWLEDGE_BASE_PURGE_CRON:0 0 2 * * *}
