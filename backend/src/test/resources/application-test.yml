spring:
  datasource:
    url: jdbc:h2:mem:pmportal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS tracker\;SET SCHEMA tracker
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: tracker
    show-sql: false

  sql:
    init:
      mode: never

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdW5pdC10ZXN0cy0zMi1ieXRlcw==
  expiration-ms: 3600000
